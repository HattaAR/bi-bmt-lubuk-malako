<section class="bmt-login-showcase" aria-label="Contoh visualisasi analitik">
  <div class="bmt-login-grid" aria-hidden="true"></div>
  <div class="bmt-login-atmosphere" aria-hidden="true">
    <i class="bmt-login-orbit"></i><i class="bmt-login-orbit-core"></i>
    <i class="bmt-login-light-point"></i>
  </div>
  <div class="bmt-login-artwork" aria-label="Tiga contoh grafik analitik tanpa data operasional">
    <article class="bmt-login-chart bmt-login-composition" title="Contoh visualisasi" aria-label="Contoh visualisasi, bukan data aktual BMT" data-illustration-card="composition">
      <h3>Jumlah Kontrak vs Outstanding</h3>
      <div class="bmt-login-bars" data-illustration-plot="composition" role="img" aria-label="Ilustrasi dua batang komposisi jumlah kontrak dan outstanding menurut kolektibilitas">
        <div class="bmt-composition-row"><span>Jumlah kontrak</span><div class="bmt-stacked-bar">
          <i class="bmt-category-l"></i><i class="bmt-category-kl"></i><i class="bmt-category-d"></i><i class="bmt-category-m"></i>
        </div></div>
        <div class="bmt-composition-row"><span>Outstanding</span><div class="bmt-stacked-bar bmt-stacked-outstanding">
          <i class="bmt-category-l"></i><i class="bmt-category-kl"></i><i class="bmt-category-d"></i><i class="bmt-category-m"></i>
        </div></div>
      </div>
      <div class="bmt-login-legend" aria-label="Kategori kolektibilitas">
        <span><i class="bmt-category-l"></i>L</span><span><i class="bmt-category-kl"></i>KL</span>
        <span><i class="bmt-category-d"></i>D</span><span><i class="bmt-category-m"></i>M</span>
      </div>
    </article>
    <article class="bmt-login-chart bmt-login-sectors" title="Contoh visualisasi" aria-label="Contoh visualisasi, bukan data aktual BMT" data-illustration-card="sectors">
      <h3>Sebaran Pembiayaan per Sektor</h3>
      <div class="bmt-login-treemap" data-illustration-plot="sectors" role="img" aria-label="Contoh visualisasi: Pertanian atau Perkebunan 59,35 persen; Perdagangan 35,61 persen; Jasa 2,97 persen; Lainnya 2,08 persen. Bukan data aktual BMT.">
        <div class="bmt-sector-farming"><span>Pertanian /<br>Perkebunan</span><strong>59,35%</strong></div>
        <div class="bmt-sector-right">
          <div class="bmt-sector-trade"><span>Perdagangan</span><strong>35,61%</strong></div>
          <div class="bmt-sector-small"><div class="bmt-sector-services" aria-hidden="true"></div><div class="bmt-sector-other" aria-hidden="true"></div></div>
        </div>
      </div>
      <div class="bmt-sector-small-labels"><span>Jasa <b>2,97%</b></span><span>Lainnya <b>2,08%</b></span></div>
    </article>
    <article class="bmt-login-chart bmt-login-duration" title="Contoh visualisasi" aria-label="Contoh visualisasi, bukan data aktual BMT" data-illustration-card="duration">
      <h3>Durasi Keterlambatan Penyelesaian</h3>
      <div class="bmt-duration-chart" data-illustration-plot="duration" role="img" aria-label="Ilustrasi grafik batang durasi keterlambatan penyelesaian dalam hari">
        <div class="bmt-duration-plot"><i></i><i></i><i></i><i></i></div>
        <div class="bmt-duration-labels"><span>1–7 hari</span><span>8–30 hari</span><span>31–90 hari</span><span>&gt;90 hari</span></div>
      </div>
    </article>
  </div>
  <p class="bmt-login-summary">Informasi pembiayaan untuk mendukung keputusan pimpinan.</p>
</section>
